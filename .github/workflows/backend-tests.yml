name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install backend dependencies and pytest
        run: python -m pip install -r requirements.txt pytest

      - name: Verify fresh-database migration
        env:
          SECRET_KEY: test-only-secret-key
          DATABASE_URL: sqlite:////tmp/edu-paper-migration-test.db
        run: flask --app run.py db upgrade

      - name: Run backend tests
        env:
          SECRET_KEY: test-only-secret-key
        run: python -m pytest -q
